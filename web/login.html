<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Netdoi super Save</title>
<link rel="icon" href="/logo.jpg">

<link rel="stylesheet" href="/app.css">

<body class="login">
<form class="login-card" method="post" action="/login">
  <img class="login-logo" src="/logo.jpg" alt="Netdoi Technology">
  <h1>Netdoi super Save</h1>
  <p class="login-sub">แลกไฟล์ระหว่างโทรศัพท์กับคอม</p>
  <input name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="ใส่ PIN" required autofocus>
  <div class="login-msg">__MESSAGE__</div>
  <button class="btn primary block" type="submit">เข้าใช้งาน</button>
</form>
</body>
</html>
